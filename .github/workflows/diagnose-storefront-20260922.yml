name: Diagnose storefront import 20260922
on:
  push:
    paths: ['.github/workflows/diagnose-storefront-20260922.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch published page and current catalogue without changing them
        run: |
          mkdir -p diagnosis
          python - <<'PY'
          import json, urllib.request, urllib.parse, time, concurrent.futures
          from pathlib import Path
          out=Path('diagnosis')
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for name,url in [('working-page','https://entertain-becalmed-buzzard.tilda.ws/gid-v-mire'),('domain','https://gidvms.ru/')]:
              try:(out/(name+'.html')).write_bytes(get(url))
              except Exception as e:(out/(name+'-error.txt')).write_text(str(e))
          def fetch_page(page):
              q=urllib.parse.urlencode({'storepartuid':'724727657493','recid':'3742006901','size':'100','slice':str(page)})
              return json.loads(get('https://store.tildaapi.com/api/getproductslist/?'+q))
          try:
              first=fetch_page(1)
              count=int(first['total'])
              pages=[first]
              with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
                  pages+=list(pool.map(fetch_page,range(2,(count+99)//100+1)))
              data={'products':[p for a in pages for p in a['products']],'pages':[{k:v for k,v in a.items() if k!='products'} for a in pages]}
              (out/'catalogue.json').write_text(json.dumps(data,ensure_ascii=False))
              selected=[p for p in data['products'] if 'splenka' in str(p.get('title','')).lower() or str(p.get('sku',''))=='8340900468']
              print('CATALOGUE_TOTAL',count,'RECEIVED',len(data['products']),'SPLENKA',len(selected),flush=True)
              (out/'imported-products.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2))
          except Exception as e:(out/'catalogue-error.txt').write_text(str(e))
          PY
      - name: Install browser for read-only storefront inspection
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Inspect displayed categories and live provider
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('diagnosis')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              try:
                  page.goto('https://entertain-becalmed-buzzard.tilda.ws/gid-v-mire',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(15000)
                  state=page.evaluate('''async()=>{let products=[],error=null;try{if(typeof GVS_PRODUCTS13==='function')products=await GVS_PRODUCTS13();}catch(e){error=String(e)}return{globals:Object.keys(window).filter(k=>/^GVS|^gvs/.test(k)),providerVersion:window.GVS_PRODUCTS13?.providerVersion,providerKeys:Object.keys(window.GVS_PRODUCTS13||{}),snapshot:window.GVS_PRODUCTS13?.getSnapshot?.(),products:products.filter(p=>/splenka/i.test(p.title||'')),error,links:Array.from(document.querySelectorAll('a')).map(a=>({text:a.textContent.trim(),href:a.getAttribute('href')})).filter(a=>/мойк|кухн/i.test(a.text)),buttons:Array.from(document.querySelectorAll('button')).filter(b=>/мойк/i.test(b.textContent)).map(b=>({text:b.textContent.trim(),html:b.outerHTML.slice(0,2000)}))}}''')
                  (out/'browser-state.json').write_text(json.dumps(state,ensure_ascii=False))
                  (out/'runtime.html').write_text(page.content())
                  page.screenshot(path=str(out/'home-desktop.png'))
                  links=[x for x in state['links'] if x['href'] and 'gc=' in x['href'] and 'мойк' in x['text'].lower()]
                  if links:
                      url=links[0]['href']
                      if url.startswith('?'):url='https://entertain-becalmed-buzzard.tilda.ws/gid-v-mire'+url
                      page.goto(url,wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(12000)
                      (out/'kitchen-page.txt').write_text(page.locator('body').inner_text())
                      (out/'kitchen-runtime.html').write_text(page.content())
                      page.screenshot(path=str(out/'kitchen-desktop.png'))
                      page.set_viewport_size({'width':390,'height':844})
                      page.wait_for_timeout(1000)
                      page.screenshot(path=str(out/'kitchen-mobile.png'))
              except Exception as e:errors.append(str(e))
              (out/'browser-errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2))
              browser.close()
          PY
      - name: Return diagnostic snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-diagnosis-20260922
          retention-days: 3
          path: diagnosis

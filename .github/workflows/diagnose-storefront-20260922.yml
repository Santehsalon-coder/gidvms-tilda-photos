name: Diagnose storefront import 20260922
on:
  push:
    paths: ['.github/workflows/diagnose-storefront-20260922.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe catalogue source and cache headers read-only
        run: |
          mkdir -p diagnosis
          python - <<'PY'
          import json,time,urllib.request,urllib.parse,concurrent.futures
          from pathlib import Path
          out=Path('diagnosis')
          base={'storepartuid':'724727657493','recid':'3742006901','size':'100','slice':'1'}
          probes=[('global-original',dict(base)),('global-no-cache',{**base,'_':str(time.time_ns())}),('global-size36',{**base,'size':'36'}),('section-kitchen',{**base,'storepartuid':'156462311843'}),('section-kitchen-no-cache',{**base,'storepartuid':'156462311843','_':str(time.time_ns())}),('global-search',{**base,'filters[search]':'Splenka'}),('global-size1000',{**base,'size':'1000'})]
          def fetch(probe):
              name,params=probe
              url='https://store.tildaapi.com/api/getproductslist/?'+urllib.parse.urlencode(params)
              result={'name':name,'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read();result.update(status=r.status,headers=dict(r.headers))
                  p=json.loads(data)
                  (out/(name+'.json')).write_text(json.dumps(p,ensure_ascii=False))
                  result.update(total=p.get('total'),received=len(p.get('products',[])),splenka=[{'uid':i.get('uid'),'sku':i.get('sku'),'title':i.get('title'),'chars':i.get('characteristics')} for i in p.get('products',[]) if 'splenka' in str(i.get('title','')).lower()])
              except Exception as e:result['error']=str(e)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(fetch,probes))
          (out/'summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False),flush=True)
          PY
      - name: Return source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-feed-probes-20260922
          retention-days: 3
          path: diagnosis

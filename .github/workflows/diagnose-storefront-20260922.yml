name: Diagnose storefront import 20260922
on:
  push:
    paths: ['.github/workflows/diagnose-storefront-20260922.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install browser
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Check storefront without modifying site or products
        run: |
          mkdir -p diagnosis
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('diagnosis')
          url='https://entertain-becalmed-buzzard.tilda.ws/gid-v-mire?gc=kuhonnye-moyki&gs=moyki-dlya-kuhni'
          results=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              context=browser.new_context(viewport={'width':1440,'height':1000})
              page=context.new_page()
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(url,wait_until='domcontentloaded',timeout=60000)
              page.wait_for_function("window.GVS_PRODUCTS13?.getSnapshot?.().complete === true",timeout=60000)
              page.wait_for_timeout(2500)
              for label,width,height in [('desktop',1440,1000),('tablet',768,1024),('mobile',390,844)]:
                  page.set_viewport_size({'width':width,'height':height})
                  page.wait_for_timeout(1200)
                  result=page.evaluate('''()=>{const s=GVS_PRODUCTS13.getSnapshot();return{url:location.href,total:s.total,loaded:s.items.length,complete:s.complete,splenkaProducts:s.items.filter(p=>/кухонная мойка splenka/i.test(p.title||'')).map(p=>({uid:p.uid,sku:p.sku,title:p.title,characteristics:p.characteristics})),cards:Array.from(document.querySelectorAll('#gvs-category-page .gc10-card')).map(e=>({uid:e.dataset.productUid,text:e.innerText,img:e.querySelector('img')?.currentSrc,loaded:!!e.querySelector('img')?.naturalWidth})),text:document.querySelector('#gvs-category-page')?.innerText||document.body.innerText,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth}}''')
                  result['view']=label
                  results.append(result)
                  page.screenshot(path=str(out/(label+'.png')))
              (out/'verification.json').write_text(json.dumps({'views':results,'errors':errors},ensure_ascii=False,indent=2))
              (out/'runtime.html').write_text(page.content())
              for cat in ['zolotaya-santehnika','oruzheynaya-stal','santehnika-satin']:
                  page.goto('https://entertain-becalmed-buzzard.tilda.ws/gid-v-mire?gc='+cat+'&gs=kuhonnye-moyki',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(1500)
                  data=page.evaluate("()=>({url:location.href,text:document.querySelector('#gvs-category-page')?.innerText||'',cards:Array.from(document.querySelectorAll('#gvs-category-page .gc10-card')).map(e=>({uid:e.dataset.productUid,text:e.innerText}))})")
                  (out/(cat+'.json')).write_text(json.dumps(data,ensure_ascii=False,indent=2))
              print(json.dumps({'views':[{'view':r['view'],'total':r['total'],'newSinkProducts':len(r['splenkaProducts']),'cards':len(r['cards']),'splenkaCards':sum('Splenka' in c['text'] for c in r['cards']),'viewport':r['viewport'],'scrollWidth':r['scrollWidth']} for r in results],'errors':errors},ensure_ascii=False),flush=True)
              browser.close()
          PY
      - name: Return browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-visible-verification-20260922
          retention-days: 3
          path: diagnosis

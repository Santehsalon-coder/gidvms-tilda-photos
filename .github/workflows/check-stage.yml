name: Check staged manifests
on:
  push:
    paths: ['input/check-stage.flag']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all candidate manifests
        shell: bash
        run: |
          shopt -s nullglob
          for f in input/catalog-v3-*.b64 input/catalog-v4-*.b64 input/catalog-v5-*.b64 input/stage-*.b64 input/full-*.b64; do
            tmp=$(mktemp)
            if base64 -d "$f" 2>/dev/null | gzip -dc > "$tmp" 2>/dev/null; then
              n=$(wc -l < "$tmp")
              first=$(head -n 1 "$tmp" | cut -f1-2)
              last=$(tail -n 1 "$tmp" | cut -f1-2)
              echo "VALID FILE=$f LINES=$n FIRST=$first LAST=$last"
            else
              echo "INVALID FILE=$f"
            fi
            rm -f "$tmp"
          done

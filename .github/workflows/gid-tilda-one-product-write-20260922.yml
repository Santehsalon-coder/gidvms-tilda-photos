name: GID - Tilda one product no-op write test
on:
  push:
    paths: ['.github/workflows/gid-tilda-one-product-write-20260922.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One-product CommerceML test with unchanged values
        env:
          TILDA_COMMERCEML_PASSWORD: ${{ secrets.TILDA_COMMERCEML_PASSWORD }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import base64, http.cookiejar, json, os, re, time, urllib.parse, urllib.request
          from decimal import Decimal
          import xml.etree.ElementTree as ET
          from pathlib import Path

          CONNECTOR='https://store.tilda.ru/connectors/commerceml/'
          USER='25163343'
          PASSWORD=os.environ.pop('TILDA_COMMERCEML_PASSWORD','')
          SKU='L070BMGD'
          EXT='GID-L070BMGD'
          UID='986190510523'
          PRICE='13500'
          QTY='7'
          PRICE_TYPE='cbcf493b-55bc-11d9-848a-00112f43529a'
          CATALOGUE='https://store.tildaapi.com/api/getproductslist/'

          def public_product():
              token=str(time.time_ns())
              products=[]
              page=1
              total=None
              while True:
                  q=urllib.parse.urlencode({'storepartuid':'724727657493','recid':'3742006901','size':'100','slice':str(page),'sort[created]':'desc','_gvs':token})
                  req=urllib.request.Request(CATALOGUE+'?'+q,headers={'User-Agent':'GidVMS-write-test/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=35) as r: data=json.load(r)
                  if total is None: total=int(data['total'])
                  if int(data['total'])!=total: raise SystemExit('Catalogue changed during verification')
                  products.extend(data['products'])
                  if len(products)>=total: break
                  page+=1
                  if page>100: raise SystemExit('Pagination limit')
              matches=[p for p in products if str(p.get('uid'))==UID and str(p.get('externalid'))==EXT and str(p.get('sku'))==SKU]
              if len(matches)!=1: raise SystemExit('Test product mapping is not unique')
              return matches[0],total

          before,total_before=public_product()
          if Decimal(str(before.get('price'))) != Decimal('13500') or str(before.get('quantity'))!='7':
              raise SystemExit('Pre-write values changed; refusing to run write test')
          protected_keys=['title','descr','text','externalid','sku','brand','characteristics','gallery','url']
          protected_before={k:before.get(k) for k in protected_keys}

          if not PASSWORD or PASSWORD!=PASSWORD.strip() or '\n' in PASSWORD or '\r' in PASSWORD:
              raise SystemExit('Secret missing/invalid')
          auth='Basic '+base64.b64encode((USER+':'+PASSWORD).encode()).decode()
          del PASSWORD
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

          def request(mode, *, filename=None, body=None):
              params={'type':'catalog','mode':mode}
              if filename: params['filename']=filename
              url=CONNECTOR+'?'+urllib.parse.urlencode(params)
              headers={'User-Agent':'GidVMS-write-test/1.0','Authorization':auth}
              data=None
              method='GET'
              if body is not None:
                  data=body
                  method='POST'
                  headers['Content-Type']='application/octet-stream'
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              with opener.open(req,timeout=45) as r:
                  raw=r.read(131072)
              text=raw.decode('utf-8-sig',errors='replace').strip()
              # never persist session ids, auth, or cookies
              safe='\n'.join(line for line in text.splitlines() if not re.search(r'(?i)session|cookie|phpsess|auth',line))
              return text,safe[:4000]

          check,_=request('checkauth')
          lines=check.splitlines()
          if not lines or lines[0].strip().lower()!='success':
              raise SystemExit('checkauth failed')
          # Standard CommerceML checkauth returns cookie name/value in body; mirror it if present.
          if len(lines)>=3 and re.fullmatch(r'[A-Za-z0-9_]+',lines[1].strip()):
              opener.addheaders=[('Cookie',lines[1].strip()+'='+lines[2].strip())]

          init,init_safe=request('init')
          if 'success' not in init.lower() and 'zip=' not in init.lower() and 'file_limit=' not in init.lower():
              raise SystemExit('init failed')

          now=time.strftime('%Y-%m-%dT%H:%M:%S')
          import_xml=f'''<?xml version="1.0" encoding="UTF-8"?>
          <КоммерческаяИнформация ВерсияСхемы="2.05" ДатаФормирования="{now}">
            <Каталог СодержитТолькоИзменения="true">
              <Ид>GID-VMS-TEST-CATALOG</Ид>
              <Наименование>GID VMS TEST</Наименование>
              <Товары>
                <Товар>
                  <Ид>{EXT}</Ид>
                  <Артикул>{SKU}</Артикул>
                  <Наименование>Гигиенический душ скрытого монтажа GID Edessa L070-BM-GD, чёрный матовый</Наименование>
                </Товар>
              </Товары>
            </Каталог>
          </КоммерческаяИнформация>'''.encode('utf-8')
          offers_xml=f'''<?xml version="1.0" encoding="UTF-8"?>
          <КоммерческаяИнформация ВерсияСхемы="2.05" ДатаФормирования="{now}">
            <ПакетПредложений СодержитТолькоИзменения="true">
              <Ид>GID-VMS-TEST-OFFERS</Ид>
              <Наименование>GID VMS TEST</Наименование>
              <ИдКаталога>GID-VMS-TEST-CATALOG</ИдКаталога>
              <ТипыЦен>
                <ТипЦены>
                  <Ид>{PRICE_TYPE}</Ид>
                  <Наименование>Розничная цена</Наименование>
                  <Валюта>RUB</Валюта>
                </ТипЦены>
              </ТипыЦен>
              <Предложения>
                <Предложение>
                  <Ид>{EXT}</Ид>
                  <Артикул>{SKU}</Артикул>
                  <Наименование>GID Edessa L070-BM-GD</Наименование>
                  <Цены><Цена>
                    <Представление>{PRICE} RUB</Представление>
                    <ИдТипаЦены>{PRICE_TYPE}</ИдТипаЦены>
                    <ЦенаЗаЕдиницу>{PRICE}</ЦенаЗаЕдиницу>
                    <Валюта>RUB</Валюта><Единица>шт</Единица><Коэффициент>1</Коэффициент>
                  </Цена></Цены>
                  <Количество>{QTY}</Количество>
                </Предложение>
              </Предложения>
            </ПакетПредложений>
          </КоммерческаяИнформация>'''.encode('utf-8')

          _,file1=request('file',filename='import0_1.xml',body=import_xml)
          _,file2=request('file',filename='offers0_1.xml',body=offers_xml)
          imp1,imp1safe=request('import',filename='import0_1.xml')
          imp2,imp2safe=request('import',filename='offers0_1.xml')
          attempts=0
          while imp2.strip().lower()=='progress' and attempts<12:
              time.sleep(2)
              imp2,imp2safe=request('import',filename='offers0_1.xml')
              attempts+=1
          if 'success' not in imp1.lower() or 'success' not in imp2.lower():
              Path('reports/result.json').write_text(json.dumps({'success':False,'init':init_safe,'import_product':imp1safe,'import_offer':imp2safe,'offer_progress_polls':attempts,'store_values_expected_unchanged':True},ensure_ascii=False,indent=2))
              raise SystemExit('CommerceML import did not finish successfully')

          time.sleep(4)
          after,total_after=public_product()
          protected_after={k:after.get(k) for k in protected_keys}
          result={
            'success':True,
            'test_product':{'uid':UID,'external_id':EXT,'sku':SKU},
            'before':{'price':str(before.get('price')),'quantity':str(before.get('quantity'))},
            'after':{'price':str(after.get('price')),'quantity':str(after.get('quantity'))},
            'protected_fields_unchanged':protected_before==protected_after,
            'catalogue_total_unchanged':total_before==total_after,
            'import_product_response':imp1safe,
            'import_offer_response':imp2safe,
            'new_products_allowed_in_tilda':False,
            'intended_changed_fields':['price','quantity'],
            'values_were_intentionally_identical':True
          }
          Path('reports/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['protected_fields_unchanged'] or not result['catalogue_total_unchanged']:
              raise SystemExit('Protected store data changed; stop before scheduling')
          if Decimal(str(after.get('price'))) != Decimal('13500') or str(after.get('quantity'))!='7':
              raise SystemExit('Price/quantity not preserved after test')
          print('One-product no-op CommerceML write test succeeded; protected fields unchanged.')
          PY
      - name: Save non-sensitive report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gid-one-product-write-test
          retention-days: 3
          path: reports
          if-no-files-found: ignore

name: GID automatic update file

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: gid-automatic-update-file
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare GID XML with exactly 471 approved Tilda cards
        run: |
          mkdir -p updates
          python - <<'PY'
          import csv, io, json, os, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from decimal import Decimal
          from pathlib import Path

          FEED='https://gid.com.ru/e/share/yandex_turbo'
          CAT='https://store.tildaapi.com/api/getproductslist/'
          OUT=Path('updates')
          OUT.mkdir(exist_ok=True)

          def get(url, limit=20000000):
              req=urllib.request.Request(
                  url,
                  headers={
                      'User-Agent':'GidVMS-auto-check/1.0',
                      'Cache-Control':'no-cache',
                      'Pragma':'no-cache'
                  }
              )
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=r.read(limit+1)
              if len(data)>limit:
                  raise RuntimeError('response too large')
              return data

          raw=get(FEED)
          clean=raw.replace(b'<!DOCTYPE yml_catalog SYSTEM "shops.dtd">',b'',1)
          if b'<!DOCTYPE' in clean.upper() or b'<!ENTITY' in clean.upper():
              raise RuntimeError('unexpected XML declarations')
          root=ET.fromstring(clean)
          offers=root.findall('./shop/offers/offer')

          bysku={}
          for o in offers:
              sku=(o.findtext('vendorCode') or '').strip()
              if not sku:
                  continue
              if sku in bysku:
                  raise RuntimeError('duplicate supplier SKU: '+sku)
              bysku[sku]=o

          token=str(time.time_ns())
          products=[]
          page=1
          total=None
          while True:
              q=urllib.parse.urlencode({
                  'storepartuid':'724727657493',
                  'recid':'3742006901',
                  'size':'100',
                  'slice':str(page),
                  'sort[created]':'desc',
                  '_gvs':token
              })
              data=json.loads(get(CAT+'?'+q))
              if total is None:
                  total=int(data['total'])
              if int(data['total'])!=total:
                  raise RuntimeError('Tilda catalogue changed during pagination')
              products.extend(data['products'])
              if len(products)>=total:
                  break
              page+=1
              if page>100:
                  raise RuntimeError('pagination limit exceeded')

          if len(products)!=total or len({str(p.get('uid')) for p in products})!=total:
              raise RuntimeError('Tilda catalogue incomplete or duplicated')

          targets=[]
          for p in products:
              sku=str(p.get('sku') or '').strip()
              ext=str(p.get('externalid') or '').strip()
              brand=str(p.get('brand') or '').strip().upper()
              if brand=='GID' and sku and ext==f'GID-{sku}':
                  targets.append(p)

          # Safety lock: these are exactly the 471 new GID cards approved on 22.09.2026.
          # If a new GID card appears later, stop instead of silently including it.
          if len(targets)!=471:
              raise RuntimeError(f'safety stop: expected exactly 471 approved GID cards, found {len(targets)}')
          if len({str(p.get('sku')) for p in targets})!=471:
              raise RuntimeError('duplicate target SKUs in Tilda')

          changes=[]
          price_changes=0
          qty_changes=0
          zeroing=0
          large_price_moves=0

          for p in targets:
              sku=str(p['sku']).strip()
              o=bysku.get(sku)
              if o is None:
                  raise RuntimeError('supplier XML missing approved SKU '+sku)

              sp=Decimal((o.findtext('price') or '').strip())
              tp=Decimal(str(p.get('price')))
              sq=int((o.findtext('count') or '').strip())
              tq=int(str(p.get('quantity')))
              available=o.get('available')

              if sp<=0 or sp>Decimal('10000000'):
                  raise RuntimeError('invalid supplier price for '+sku)
              if sq<0 or sq>1000000:
                  raise RuntimeError('invalid supplier quantity for '+sku)
              if (available=='true') != (sq>0):
                  raise RuntimeError('supplier available/count conflict for '+sku)

              pct=float((sp-tp)/tp*100) if tp>0 else None
              if sp!=tp:
                  price_changes+=1
              if sq!=tq:
                  qty_changes+=1
              if tq>0 and sq==0:
                  zeroing+=1
              if pct is not None and abs(pct)>=20:
                  large_price_moves+=1

              if sp!=tp or sq!=tq:
                  changes.append({
                      'Tilda UID':str(p.get('uid')),
                      'External ID':str(p.get('externalid')),
                      'SKU':sku,
                      'Title':str(p.get('title')),
                      'Price':str(sp),
                      'Quantity':str(sq)
                  })

          resulting_zero=sum(
              1 for p in targets
              if int((bysku[str(p['sku'])].findtext('count') or '').strip())==0
          )

          flags=[]
          if zeroing>120:
              flags.append('too many in-stock cards would become zero')
          if large_price_moves>80:
              flags.append('too many prices move by >=20%')
          if price_changes>400:
              flags.append('too many prices changed at once')
          if resulting_zero>250:
              flags.append('too many approved GID cards would be zero stock')
          if flags:
              raise RuntimeError('safety stop: '+'; '.join(flags))

          csv_path=OUT/'GID-current-update.csv'
          with csv_path.open('w',encoding='utf-8-sig',newline='') as f:
              writer=csv.DictWriter(
                  f,
                  fieldnames=['Tilda UID','External ID','SKU','Title','Price','Quantity'],
                  delimiter=';'
              )
              writer.writeheader()
              writer.writerows(changes)

          summary={
              'generated_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'feed_date':root.get('date'),
              'approved_targets':471,
              'catalogue_total':total,
              'changed_products':len(changes),
              'price_changes':price_changes,
              'quantity_changes':qty_changes,
              'would_change_to_zero':zeroing,
              'resulting_zero_stock':resulting_zero,
              'safe':True,
              'note':'CSV updates only existing approved GID cards. In Tilda map Title to Ignore.'
          }
          (OUT/'GID-current-update-summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2),
              encoding='utf-8'
          )

          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Publish only when generated file changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/GID-current-update.csv updates/GID-current-update-summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update current GID price and stock CSV'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No change in generated GID update files."
          fi

      - name: Upload current update file
        uses: actions/upload-artifact@v4
        with:
          name: GID-current-update
          retention-days: 7
          path: |
            updates/GID-current-update.csv
            updates/GID-current-update-summary.json

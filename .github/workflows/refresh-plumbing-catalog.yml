name: Refresh plumbing storefront snapshot
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/refresh-plumbing-catalog.py
      - .github/workflows/refresh-plumbing-catalog.yml
permissions:
  contents: write
concurrency:
  group: plumbing-storefront-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build complete snapshot from public Tilda catalogue
        run: python3 scripts/refresh-plumbing-catalog.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/plumbing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh complete plumbing storefront snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

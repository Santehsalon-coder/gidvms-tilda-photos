name: Probe catalog source 20260922
on:
  push:
    paths: ['.github/workflows/probe-catalog-source-20260922.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public catalog responses
        run: |
          mkdir -p probes
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,json,time,concurrent.futures
          out=Path('probes');stamp=str(time.time_ns())
          base={'storepartuid':'724727657493','recid':'3742006901','size':'100','slice':'1'}
          cases=[('all-fixed',base),('all-revision',{**base,'_gvs':stamp}),('all-c',{**base,'c':stamp}),('all-underscore',{**base,'_':stamp}),('all-lastpage',{**base,'slice':'6','_gvs':stamp}),('all-created',{**base,'sort[created]':'desc','_gvs':stamp}),('all36',{**base,'size':'36','_gvs':stamp}),('kitchen',{**base,'storepartuid':'156462311843'}),('kitchen-revision',{**base,'storepartuid':'156462311843','c':stamp,'_gvs':stamp})]
          def one(case):
              name,params=case;url='https://store.tildaapi.com/api/getproductslist/?'+urllib.parse.urlencode(params)
              result={'name':name,'url':url}
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      data=json.loads(response.read());result['headers']=dict(response.headers)
                  (out/(name+'.json')).write_text(json.dumps(data,ensure_ascii=False))
                  products=data.get('products',[])
                  result.update(total=data.get('total'),count=len(products),meta={k:v for k,v in data.items() if k!='products'},splenka=[{'uid':p.get('uid'),'title':p.get('title'),'sku':p.get('sku'),'partuids':p.get('partuids')} for p in products if 'splenka' in str(p.get('title','')).lower()])
              except Exception as e:result['error']=str(e)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:summary=list(pool.map(one,cases))
          url='https://store.tildaapi.com/api/getproduct/?'+urllib.parse.urlencode({'storepartuid':'156462311843','recid':'3742006901','productuid':'579023911223','c':stamp})
          try:
              with urllib.request.urlopen(url,timeout=25) as response:data=json.loads(response.read())
              (out/'specific-new-product.json').write_text(json.dumps(data,ensure_ascii=False))
          except Exception as e:(out/'specific-new-product-error.txt').write_text(str(e))
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps([{k:v for k,v in s.items() if k not in ['headers','meta']} for s in summary],ensure_ascii=False))
          PY
      - name: Return public source comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-source-probes
          retention-days: 3
          path: probes

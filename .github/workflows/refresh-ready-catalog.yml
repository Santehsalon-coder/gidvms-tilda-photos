name: Refresh ready category snapshots
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/refresh-ready-catalog.py
      - .github/workflows/refresh-ready-catalog.yml
permissions:
  contents: write
concurrency:
  group: ready-category-snapshots
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            catalog/ready536
      - run: python3 scripts/refresh-ready-catalog.py
      - name: Publish complete snapshot generation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/ready536
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh validated ready category snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1

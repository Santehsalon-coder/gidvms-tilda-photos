name: Recover valid manifest rows
on:
  push:
    paths: ['input/recover-manifests.flag']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover valid rows from every candidate
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          tmpall=$(mktemp)
          : > "$tmpall"
          for f in input/*.b64 input/*.txt; do
            tmp=$(mktemp)
            base64 --ignore-garbage -d "$f" 2>/dev/null | gzip -dc > "$tmp" 2>/dev/null
            grep -E '^[^[:space:]]+\t[0-9]{2}\thttps://00\.img\.avito\.st/image/' "$tmp" >> "$tmpall" || true
            rm -f "$tmp"
          done
          for f in input/*.tsv; do
            grep -E '^[^[:space:]]+\t[0-9]{2}\thttps://00\.img\.avito\.st/image/' "$f" >> "$tmpall" || true
          done
          sort -u "$tmpall" > input/recovered-valid.tsv
          n=$(wc -l < input/recovered-valid.tsv)
          echo "RECOVERED_UNIQUE=$n"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add input/recovered-valid.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Recover valid catalog manifest rows"
            git push
          fi

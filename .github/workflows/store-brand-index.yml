name: Update store brand index
on:
  workflow_run:
    workflows: ["Refresh ready category snapshots"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-brand-index.yml'
      - 'scripts/store-brand-extras.py'
      - 'scripts/store-brand-membership.cjs'
      - 'scripts/build-store-brand.cjs'
permissions:
  contents: write
concurrency:
  group: store-brand-index
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            catalog/ready536
      - name: Collect products outside the standard categories
        run: python3 scripts/store-brand-extras.py catalog/ready536 "$RUNNER_TEMP/store-extras.json"
      - name: Derive the brand pages from published products
        run: node scripts/build-store-brand.cjs catalog/ready536 "$RUNNER_TEMP/store-extras.json"
      - name: Publish brand index and its product data together
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog/ready536/store-brand.json catalog/ready536/store-brands/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update store brand membership'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

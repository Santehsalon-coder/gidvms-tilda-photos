name: Compare GID floor basin identities
on:
  push:
    paths: ['.github/workflows/compare-gid-floor-20260922.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: python -m pip install -q Pillow
      - name: Read six public photographs only
        run: |
          mkdir -p compare
          python - <<'PY'
          import io,urllib.request
          from pathlib import Path
          from PIL import Image,ImageDraw
          sources=[('old-Estetika','https://static.tildacdn.com/stor6362-3333-4464-b033-373930303365/d084b9cbed070b60888ff3c8fdcd5a2a.jpg'),('GID-Nb188','https://gid.com.ru/d/nb188_2.png'),('old-Harmony-white','https://static.tildacdn.com/stor3862-6439-4565-b566-313639393366/37afb66a197de71275f502017505e10b.jpg'),('GID-Nb131','https://gid.com.ru/d/nb131_1.png'),('old-Harmony-black','https://static.tildacdn.com/stor6331-6162-4234-b530-646234373230/d538e2bdac0ccdc64c6b057f1ecc04b4.jpg'),('GID-Nb131bm','https://gid.com.ru/d/nb131bm_2.jpg')]
          canvas=Image.new('RGB',(1000,1200),'white');draw=ImageDraw.Draw(canvas)
          for i,(name,url) in enumerate(sources):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:data=r.read()
              image=Image.open(io.BytesIO(data)).convert('RGB');image.thumbnail((490,360))
              x=(i%2)*500;y=(i//2)*400
              canvas.paste(image,(x+(500-image.width)//2,y+(360-image.height)//2));draw.text((x+15,y+375),name,fill='black')
              Path('compare/'+name+'.jpg').write_bytes(data)
          canvas.save('compare/comparison.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gid-floor-comparison
          retention-days: 3
          path: compare

name: Verify every published GraniStone palette URL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-palette384.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /palettes/granistone-20261023-v384/verify-public.py
            /palettes/granistone-20261023-v384/url-request.json
      - run: python -m pip install -q Pillow==12.3.0 requests
      - run: python palettes/granistone-20261023-v384/verify-public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-public-url-audit
          path: palette-public-url-audit.json
          retention-days: 14

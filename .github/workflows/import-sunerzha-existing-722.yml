name: Prepare existing 722 Sunerzha product galleries
on:
  push:
    branches: [assets/sunerzha-import-test-2026-11-09]
    paths:
      - batches/sunerzha-existing-722-2026-11-09/**
      - .github/workflows/import-sunerzha-existing-722.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sunerzha-existing-722-photos
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/sunerzha-import-test-2026-11-09
          fetch-depth: 1
      - name: Install image decoder
        run: python -m pip install Pillow
      - name: Download exact product photographs
        run: python batches/sunerzha-existing-722-2026-11-09/prepare.py
      - name: Publish only this photo batch to the isolated asset branch
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/sunerzha-existing-722-2026-11-09
          if ! git diff --cached --quiet; then
            git commit -m 'Publish exact Sunerzha photos for existing 722 products'
            git pull --rebase origin assets/sunerzha-import-test-2026-11-09
            git push origin HEAD:assets/sunerzha-import-test-2026-11-09
          fi
          echo "photo_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify every public photo URL
        run: python batches/sunerzha-existing-722-2026-11-09/prepare.py --verify '${{ steps.publish.outputs.photo_commit }}'
      - name: Publish verification report
        if: always()
        run: |
          if test -f photos/sunerzha-existing-722-2026-11-09/verification.json; then
            git add photos/sunerzha-existing-722-2026-11-09/verification.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record Sunerzha public photo verification'
              git pull --rebase origin assets/sunerzha-import-test-2026-11-09
              git push origin HEAD:assets/sunerzha-import-test-2026-11-09
            fi
          fi
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunerzha-existing-722-photo-reports
          retention-days: 7
          path: |
            photos/sunerzha-existing-722-2026-11-09/report.json
            photos/sunerzha-existing-722-2026-11-09/verification.json

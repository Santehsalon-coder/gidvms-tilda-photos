name: GID MoySklad read-only preflight

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gid-moysklad-readonly-preflight-20261002.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: gid-moysklad-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read assigned sample only; no write requests or full response logging
        env:
          MOYSKLAD_GID_TOKEN: ${{ secrets.MOYSKLAD_GID_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import io
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path
          from zoneinfo import ZoneInfo

          BASE = 'https://api.moysklad.ru/api/remap/1.2/'
          FEED = 'https://gid.com.ru/e/share/yandex_turbo'
          SKU = 'L070BMGD'
          EXT = 'GID-L070BMGD'
          LOGIN = 'gidsync@gidvms'
          STORE_NAME = 'GID — склад поставщика (тест)'
          PRODUCT_UI_ID = '1d36822b-b994-11f1-0a80-168400279093'
          STORE_UI_ID = '84eb45d2-b9a1-11f1-0a80-090e0028cc44'
          TOKEN = os.environ.pop('MOYSKLAD_GID_TOKEN', '')
          ALLOWED = {'context/employee', 'entity/product', 'entity/store', 'report/stock/bystore'}
          report = {'mode': 'read_only', 'checked_at_utc': datetime.now(timezone.utc).isoformat(),
                    'sku': SKU, 'moysklad_modified': False, 'tilda_accessed': False,
                    'write_requests': 0, 'success': False}
          stage = 'secret'

          class SafeFailure(Exception):
              pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SafeFailure('Redirect rejected; credentials were not forwarded')

          opener = urllib.request.build_opener(NoRedirect())

          def request_bytes(url, headers, limit):
              req = urllib.request.Request(url, headers=headers, method='GET')
              for attempt in range(2):
                  try:
                      with opener.open(req, timeout=25) as response:
                          data = response.read(limit + 1)
                          coding = response.headers.get('Content-Encoding', '')
                      if len(data) > limit:
                          raise SafeFailure('Response too large')
                      if coding == 'gzip':
                          with gzip.GzipFile(fileobj=io.BytesIO(data)) as gz:
                              data = gz.read(limit + 1)
                          if len(data) > limit:
                              raise SafeFailure('Decoded response too large')
                      return data
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                      codes = []
                      try:
                          data = exc.read(65536)
                          if exc.headers.get('Content-Encoding') == 'gzip':
                              data = gzip.decompress(data)
                          errors = json.loads(data).get('errors', [])
                          codes = [e['code'] for e in errors if isinstance(e.get('code'), int)]
                      except Exception:
                          pass
                      if status in (429, 502, 503, 504) and attempt == 0:
                          time.sleep(3)
                          continue
                      report['http_status'] = status
                      report['api_error_codes'] = codes
                      raise SafeFailure('HTTP request failed; response body withheld') from None
                  except (urllib.error.URLError, TimeoutError):
                      raise SafeFailure('Network request failed') from None

          def api(path, params=None):
              if path not in ALLOWED:
                  raise SafeFailure('Endpoint not allowed')
              url = BASE + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              raw = request_bytes(url, {'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/json;charset=utf-8', 'Accept-Encoding': 'gzip',
                  'User-Agent': 'GidVMS-MoySklad-ReadOnly/1.0'}, 2000000)
              return json.loads(raw)

          def identifier(value):
              text = str(value or '')
              if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', text):
                  raise SafeFailure('Invalid entity identifier')
              return text

          def meta_id(obj):
              href = obj.get('meta', {}).get('href', '')
              return urllib.parse.urlsplit(href).path.rstrip('/').rsplit('/', 1)[-1]

          def assigned(obj, employee_id):
              return meta_id(obj.get('owner', {})) == employee_id

          def ui_matches(obj, expected):
              href = obj.get('meta', {}).get('uuidHref', '')
              if not href:
                  return False
              fragment = urllib.parse.urlsplit(href).fragment
              return urllib.parse.parse_qs(fragment.partition('?')[2]).get('id') == [expected]

          def single(data):
              rows = data.get('rows', [])
              if data.get('meta', {}).get('size') != 1 or len(rows) != 1:
                  raise SafeFailure('Expected exactly one matching accessible entity')
              return rows[0]

          def qty(value):
              amount = Decimal(str(value))
              if not amount.is_finite() or amount != amount.to_integral_value() or abs(amount) > 1000000:
                  raise SafeFailure('Invalid stock value')
              return int(amount)

          try:
              if not TOKEN or TOKEN != TOKEN.strip() or any(c.isspace() for c in TOKEN):
                  raise SafeFailure('Secret missing or malformed; do not paste its value into logs')
              stage = 'service_identity'
              employee = api('context/employee')
              if employee.get('uid') != LOGIN:
                  raise SafeFailure('Token is not confirmed as the approved service login')
              employee_id = identifier(employee.get('id'))
              report['service_login_verified'] = True

              stage = 'assigned_product'
              product = single(api('entity/product', {'filter': 'externalCode=' + EXT + ';article=' + SKU, 'limit': 2}))
              product_id = identifier(product.get('id'))
              if product.get('externalCode') != EXT or product.get('article') != SKU or product.get('archived'):
                  raise SafeFailure('Unexpected sample product')
              if not ui_matches(product, PRODUCT_UI_ID) or not assigned(product, employee_id):
                  raise SafeFailure('Sample identity or service ownership does not match')
              report['product_verified'] = True
              report['product_assigned_to_service'] = True
              sale_prices = [p for p in product.get('salePrices', []) if p.get('priceType', {}).get('name') == 'Цена продажи']
              if len(sale_prices) != 1:
                  raise SafeFailure('Expected one sale price type')
              price = Decimal(str(sale_prices[0].get('value'))) / 100
              if not price.is_finite() or price <= 0:
                  raise SafeFailure('Invalid sale price')
              report['moysklad_sale_price'] = str(price)

              stage = 'assigned_store'
              store = single(api('entity/store', {'filter': 'name=' + STORE_NAME, 'limit': 2}))
              store_id = identifier(store.get('id'))
              if store.get('name') != STORE_NAME or store.get('archived'):
                  raise SafeFailure('Unexpected sample warehouse')
              if not ui_matches(store, STORE_UI_ID) or not assigned(store, employee_id):
                  raise SafeFailure('Warehouse identity or service ownership does not match')
              report['store_verified'] = True
              report['store_assigned_to_service'] = True

              stage = 'stock_report'
              filt = 'product=' + BASE + 'entity/product/' + product_id + ';store=' + BASE + 'entity/store/' + store_id + ';stockMode=all'
              data = api('report/stock/bystore', {'filter': filt, 'limit': 2})
              rows = [r for r in data.get('rows', []) if meta_id(r) == product_id]
              if len(rows) != 1:
                  raise SafeFailure('Sample stock row was not uniquely returned')
              by_store = [s for s in rows[0].get('stockByStore', []) if meta_id(s) == store_id]
              if len(by_store) != 1:
                  raise SafeFailure('Sample warehouse stock was not uniquely returned')
              stock = qty(by_store[0].get('stock'))
              reserve = qty(by_store[0].get('reserve'))
              report['stock_readable'] = True
              report['moysklad_stock'] = stock
              report['moysklad_reserve'] = reserve
              report['moysklad_available'] = stock - reserve
              report['success'] = True

              stage = 'supplier_read'
              try:
                  raw = request_bytes(FEED, {'User-Agent': 'GidVMS-MoySklad-ReadOnly/1.0', 'Cache-Control': 'no-cache'}, 20000000)
                  raw = raw.replace(b'<!DOCTYPE yml_catalog SYSTEM "shops.dtd">', b'', 1)
                  if b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():
                      raise SafeFailure('Unexpected XML declarations')
                  root = ET.fromstring(raw)
                  if root.tag != 'yml_catalog':
                      raise SafeFailure('Unexpected feed format')
                  matches = [o for o in root.findall('./shop/offers/offer') if (o.findtext('vendorCode') or '').strip() == SKU]
                  if len(matches) != 1:
                      raise SafeFailure('Sample missing or duplicated in supplier feed')
                  offer = matches[0]
                  supplier_qty = qty((offer.findtext('count') or '').strip())
                  supplier_price = Decimal((offer.findtext('price') or '').strip())
                  if supplier_qty < 0 or not supplier_price.is_finite() or supplier_price <= 0:
                      raise SafeFailure('Invalid supplier values')
                  if offer.get('available') not in ('true', 'false') or (offer.get('available') == 'true') != (supplier_qty > 0):
                      raise SafeFailure('Supplier availability conflicts with stock')
                  stamp = root.get('date', '')
                  dated = datetime.strptime(stamp, '%Y-%m-%d %H:%M').replace(tzinfo=ZoneInfo('Europe/Moscow'))
                  age = (datetime.now(timezone.utc) - dated).total_seconds() / 3600
                  report.update({'supplier_feed_date_moscow': stamp, 'supplier_fresh': -0.25 <= age <= 6,
                                 'supplier_quantity': supplier_qty, 'supplier_retail_price': str(supplier_price),
                                 'sample_quantity_difference': supplier_qty - stock,
                                 'sample_price_matches': supplier_price == price})
              except Exception:
                  report['supplier_check'] = 'Could not verify fresh supplier data; no write attempted'
          except SafeFailure as exc:
              report['failed_stage'] = stage
              report['error'] = str(exc)
          except Exception as exc:
              report['failed_stage'] = stage
              report['error_type'] = type(exc).__name__
              report['error'] = 'Unexpected response format; response and credentials withheld'
          finally:
              TOKEN = ''
              safe_json = json.dumps(report, ensure_ascii=False, sort_keys=True)
              print('GID_MOYSKLAD_PREFLIGHT=' + safe_json)
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  Path(summary_file).write_text('## Read-only GID access check\n\n```json\n' + json.dumps(report, ensure_ascii=False, indent=2) + '\n```\n', encoding='utf-8')
          sys.exit(0 if report['success'] else 1)
          PY

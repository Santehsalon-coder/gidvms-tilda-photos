name: GID 471 dry-run preview
on:
  push:
    paths: ['.github/workflows/gid-471-dry-run-20260922.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare 471 imported GID cards with current supplier XML
        run: |
          mkdir -p reports
          python - <<'PY'
          import collections, csv, io, json, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          FEED='https://gid.com.ru/e/share/yandex_turbo'
          CAT='https://store.tildaapi.com/api/getproductslist/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GidVMS-dry-run/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read()

          raw=get(FEED).replace(b'<!DOCTYPE yml_catalog SYSTEM "shops.dtd">',b'',1)
          root=ET.fromstring(raw)
          offers=root.findall('./shop/offers/offer')
          bysku={}
          duplicate_supplier=[]
          for o in offers:
              sku=(o.findtext('vendorCode') or '').strip()
              if not sku: continue
              if sku in bysku: duplicate_supplier.append(sku)
              bysku[sku]=o
          if duplicate_supplier:
              raise SystemExit('Supplier duplicate SKUs detected')

          token=str(time.time_ns()); products=[]; page=1; total=None
          while True:
              q=urllib.parse.urlencode({'storepartuid':'724727657493','recid':'3742006901','size':'100','slice':str(page),'sort[created]':'desc','_gvs':token})
              data=json.loads(get(CAT+'?'+q))
              if total is None: total=int(data['total'])
              if int(data['total'])!=total: raise SystemExit('Catalogue changed during pagination')
              products.extend(data['products'])
              if len(products)>=total: break
              page+=1
              if page>100: raise SystemExit('Pagination limit')
          if len(products)!=total or len({str(p.get('uid')) for p in products})!=total:
              raise SystemExit('Incomplete or duplicated Tilda catalogue')

          targets=[]
          for p in products:
              sku=str(p.get('sku') or '').strip()
              ext=str(p.get('externalid') or '').strip()
              brand=str(p.get('brand') or '').strip().upper()
              if brand=='GID' and sku and ext==f'GID-{sku}':
                  targets.append(p)
          if len(targets)!=471:
              raise SystemExit(f'Expected exactly 471 mapped GID cards, found {len(targets)}')
          if len({p['sku'] for p in targets})!=471:
              raise SystemExit('Duplicate target SKUs in Tilda')

          rows=[]; missing=[]; changed_price=[]; changed_qty=[]; zeroing=[]; big_price_moves=[]; bad=[]
          for p in targets:
              sku=str(p['sku']).strip()
              o=bysku.get(sku)
              if o is None:
                  missing.append(sku); continue
              try:
                  sp=Decimal((o.findtext('price') or '').strip())
                  tp=Decimal(str(p.get('price')))
                  sq=int((o.findtext('count') or '').strip())
                  tq=int(str(p.get('quantity')))
              except Exception:
                  bad.append(sku); continue
              available=o.get('available')
              if (available=='true') != (sq>0):
                  bad.append(sku); continue
              if sp<=0 or sp>10000000 or sq<0 or sq>1000000:
                  bad.append(sku); continue
              pct=None
              if tp>0: pct=float((sp-tp)/tp*100)
              row={'sku':sku,'uid':str(p.get('uid')),'external_id':str(p.get('externalid')),'title':str(p.get('title')),'tilda_price':str(tp),'supplier_price':str(sp),'price_change':str(sp-tp),'price_change_pct':pct,'tilda_quantity':tq,'supplier_quantity':sq,'quantity_change':sq-tq,'supplier_available':available}
              rows.append(row)
              if sp!=tp: changed_price.append(row)
              if sq!=tq: changed_qty.append(row)
              if tq>0 and sq==0: zeroing.append(row)
              if pct is not None and abs(pct)>=20: big_price_moves.append(row)

          if missing or bad:
              raise SystemExit(f'Missing={len(missing)}, invalid={len(bad)}; refusing to approve update')

          price_up=sum(1 for r in changed_price if Decimal(r['supplier_price'])>Decimal(r['tilda_price']))
          price_down=len(changed_price)-price_up
          qty_up=sum(1 for r in changed_qty if r['supplier_quantity']>r['tilda_quantity'])
          qty_down=len(changed_qty)-qty_up
          resulting_zero=sum(1 for r in rows if r['supplier_quantity']==0)
          current_zero=sum(1 for r in rows if r['tilda_quantity']==0)
          # Conservative safety flags; preview only, never writes.
          flags=[]
          if len(zeroing)>120: flags.append('More than 120 currently-in-stock cards would become zero')
          if len(big_price_moves)>80: flags.append('More than 80 prices move by 20% or more')
          if len(changed_price)>400: flags.append('More than 400 prices changed simultaneously')
          if resulting_zero>250: flags.append('More than 250 target cards would be zero stock')
          approved_for_future_write = not flags

          summary={
            'mode':'dry-run','store_modified':False,'targets':len(targets),
            'supplier_offer_count':len(offers),'feed_date':root.get('date'),
            'catalogue_total':total,'missing_targets':len(missing),'invalid_targets':len(bad),
            'price_changes':len(changed_price),'price_increases':price_up,'price_decreases':price_down,
            'quantity_changes':len(changed_qty),'quantity_increases':qty_up,'quantity_decreases':qty_down,
            'current_zero_stock':current_zero,'resulting_zero_stock':resulting_zero,
            'would_change_to_zero':len(zeroing),'price_moves_ge_20pct':len(big_price_moves),
            'safety_flags':flags,'safe_to_proceed_to_guarded_write':approved_for_future_write
          }
          Path('reports/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          Path('reports/all-471.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          Path('reports/changed-prices.json').write_text(json.dumps(changed_price,ensure_ascii=False,indent=2))
          Path('reports/changed-quantities.json').write_text(json.dumps(changed_qty,ensure_ascii=False,indent=2))
          Path('reports/would-become-zero.json').write_text(json.dumps(zeroing,ensure_ascii=False,indent=2))
          Path('reports/price-moves-ge-20pct.json').write_text(json.dumps(big_price_moves,ensure_ascii=False,indent=2))
          with open('reports/changes.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()),delimiter=';'); w.writeheader()
              for r in rows:
                  if Decimal(r['supplier_price'])!=Decimal(r['tilda_price']) or r['supplier_quantity']!=r['tilda_quantity']:
                      w.writerow(r)
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Save read-only comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gid-471-dry-run
          retention-days: 7
          path: reports
